name: CI/CD Pipeline Personal Portfolio

# 1. Eventos que disparan el flujo
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 2. Definición de trabajos
jobs:
  build-and-test:
    name: Build & Test application
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el código del repositorio en el runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Paso 2: Configurar el entorno de tiempo de ejecución
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Paso 3: Instalar dependencias
      - name: Install Dependencies
        run: npm ci

      # Paso 4: Ejecutar Linter
      - name: Run Linter
        run: npm run lint --if-present

      # Paso 5: Ejecutar Pruebas Unitarias
      - name: Run Unit Tests
        run: npm test

      # Paso 6: Compilar el proyecto
      - name: Build Project
        run: npm run build
        env:
          VITE_HCAPTCHA_SITE_KEY: ${{ secrets.VITE_HCAPTCHA_SITE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Paso 1: Clonar el código
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Paso 2: Conectar al servidor via SSH y desplegar
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ~/projects/my_Portfolio_React_v2
            git pull origin main
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            echo "✅ Deploy completado exitosamente"

      # Paso 3: Verificar que el sitio responde
      - name: Health Check
        run: |
          sleep 15
          curl -f https://dsantacruz.dev || exit 1
          echo "✅ Health check passed"