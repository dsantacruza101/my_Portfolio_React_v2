name: CI/CD Pipeline Personal Portfolio

# 1. Eventos que disparan el flujo
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 2. Definición de trabajos
jobs:
  build-and-test:
    name: Build & Test application
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el código del repositorio en el runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Paso 2: Configurar el entorno de tiempo de ejecución
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Paso 3: Instalar dependencias
      - name: Install Dependencies
        run: npm ci

      # Paso 4: Ejecutar Linter
      - name: Run Linter
        run: npm run lint --if-present

      # Paso 5: Ejecutar Pruebas Unitarias
      - name: Run Unit Tests
        run: npm test

      # Paso 6: Compilar el proyecto
      - name: Build Project
        run: npm run build
        env:
          VITE_HCAPTCHA_SITE_KEY: ${{ secrets.VITE_HCAPTCHA_SITE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger webhook deploy
        run: |
          curl -X POST https://webhook.dsantacruz.com/deploy/portfolio \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$(echo -n '{"ref":"refs/heads/main"}' | openssl dgst -sha256 -hmac '${{ secrets.WEBHOOK_SECRET }}' | cut -d' ' -f2)" \
            -d '{"ref":"refs/heads/main"}'

      - name: Health Check
        run: |
          sleep 30
          curl -f https://dsantacruz.dev || exit 1
          echo "✅ Health check passed"